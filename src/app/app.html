<h1z>Video Game API</h1z>
  @for (game of gameList; track game.id){
    <div class ="Cool">
      <p><strong>Game Name: </strong>{{game.name}}</p>
      <p>Genre: {{game.genre}}</p>
      <p>Amount of Copies Sold: {{game.copiesSold}}</p>
      @if (game.isOwned){
        <p class="status">Currently Owned: {{game.isOwned}}</p>
      }</div>
  }@empty {
    <p>This is nothing</p>
  }
